name: iOS App Store

# macOS minutes are the expensive part. Run this by hand from the Actions tab
# so a push does not start a 20-minute build.
on:
  workflow_dispatch:

concurrency:
  group: ios-app-store
  cancel-in-progress: true

jobs:
  build-ipa:
    name: Build signed IPA
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check required secrets
        env:
          IOS_BUILD_CERTIFICATE_BASE64: ${{ secrets.IOS_BUILD_CERTIFICATE_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_PROFILE_NAME: ${{ secrets.IOS_PROFILE_NAME }}
        run: |
          missing=0
          for name in IOS_BUILD_CERTIFICATE_BASE64 IOS_P12_PASSWORD IOS_PROVISION_PROFILE_BASE64 APPLE_TEAM_ID IOS_PROFILE_NAME; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Add the secrets under Settings → Secrets and variables → Actions."
            echo "On Windows, run: .github/scripts/prepare-ios-signing.ps1"
            exit 1
          fi

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.41.1"
          cache: true

      - name: Install Dart/iOS deps
        run: |
          flutter pub get
          cd ios
          pod install --repo-update

      - name: Install Apple certificate and provisioning profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.IOS_BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/build_certificate.p12"
          PP_PATH="$RUNNER_TEMP/build_pp.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERTIFICATE_PATH"
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o "$PP_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          UUID=$(security cms -D -i "$PP_PATH" | plutil -extract UUID raw -)
          cp "$PP_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"
          echo "Installed provisioning profile UUID=$UUID"

      - name: Configure signing for App Store
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_PROFILE_NAME: ${{ secrets.IOS_PROFILE_NAME }}
        run: |
          python3 - <<PY
          from pathlib import Path
          import os
          team = os.environ["APPLE_TEAM_ID"]
          profile = os.environ["IOS_PROFILE_NAME"]
          p = Path("ios/Runner.xcodeproj/project.pbxproj")
          text = p.read_text()
          needle = "PRODUCT_BUNDLE_IDENTIFIER = no.fylgja.app;"
          insert = (
              "CODE_SIGN_STYLE = Manual;\n"
              "\t\t\t\tCODE_SIGN_IDENTITY = \"Apple Distribution\";\n"
              f"\t\t\t\tDEVELOPMENT_TEAM = {team};\n"
              f"\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = \"{profile}\";\n"
              "\t\t\t\tPRODUCT_BUNDLE_IDENTIFIER = no.fylgja.app;"
          )
          if needle not in text:
              raise SystemExit("Could not find iOS bundle id in project.pbxproj")
          p.write_text(text.replace(needle, insert))
          PY

          cat > ios/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>compileBitcode</key>
            <false/>
            <key>uploadBitcode</key>
            <false/>
            <key>uploadSymbols</key>
            <true/>
            <key>provisioningProfiles</key>
            <dict>
              <key>no.fylgja.app</key>
              <string>${IOS_PROFILE_NAME}</string>
            </dict>
          </dict>
          </plist>
          EOF

      - name: Build App Store IPA
        run: |
          flutter build ipa \
            --build-name=1.0.29 \
            --build-number=89 \
            --export-options-plist=ios/ExportOptions.plist

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: fylgja-ios-appstore
          path: build/ios/ipa/*.ipa
          if-no-files-found: error
          retention-days: 14
